name: Analysis utility tests

on:
  push:
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis-tests.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standard-library unit tests
        run: python -m unittest discover -s analysis/tests -v
